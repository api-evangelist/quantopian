name: Quantopian
description: >-
  Quantopian was a Boston-based crowd-sourced quantitative investment firm and
  algorithmic-trading platform (backed by a16z and Bessemer Venture Partners)
  where members wrote, backtested, and shared Python trading algorithms against
  historical market data. The company ceased operations in November 2020 and its
  intellectual property was acquired by Robinhood; its public developer platform
  and hosted API are retired. Its widely-used open-source Python libraries -
  Zipline (backtesting), Pyfolio, Alphalens, Empyrical, and trading-calendars -
  remain published on PyPI and its GitHub organization stays live.
